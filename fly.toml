# fly.toml app configuration file generated for lambogflagg on 2026-11-10T22:19:38Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'lambogflagg'
primary_region = 'lhr'

[build]
[env]
  BASE_URL = 'https://lambogflagg.fly.dev'
  CLIENT_IP_HEADER = 'Fly-Client-IP'
  TIMEZONE = 'Atlantic/Reykjavik'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/livez'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  processes = ['app']
